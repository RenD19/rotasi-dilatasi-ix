<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pratinjau Latihan Mandiri · Rotasi dan Dilatasi</title>
<link rel="stylesheet" id="katexCss" media="print" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.45/katex.min.css" integrity="sha384-UA8juhPf75SzzAMA/4fo3yOU7sBJ0om7SCD2GHq0fZqZco6tr1UCV7nUbk9J90JM" crossorigin="anonymous" referrerpolicy="no-referrer">
<script defer id="katexJs" src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.45/katex.min.js" integrity="sha384-Tt7wBxLKwSzFVRET4O4U9H6v8MNaQ/CjN2FMP4xFm0ErrFu6aNqoonRVW5W40iGI" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* ==========================================================================
   gaya.css · Program Linear: dari Contoh Kontekstual ke Nilai Optimum
   Urutan lapisan (yang lebih kanan menang):
     dasar → komponen → tata-letak → tab → mode
   - dasar      : warna (variabel), huruf, kepala halaman, tombol tab
   - komponen   : kartu, tombol, tabel, isian, maskot Plus, rumus
   - tata-letak : susunan kolom per tab dan tampilan ringkas di PC/laptop
   - tab        : aturan khusus isi tab Belajar (penjelasan, garis selidik) dan isian soal
   - mode       : perubahan yang hanya berlaku pada satu mode
   ========================================================================== */
@layer dasar, komponen, tata-letak, tab, mode;

@layer dasar {
:root{--ink:#1b2a41;--mut:#5b6b82;--bg:#eef3fb;--card:#fff;--blue:#1d4ed8;--green:#15803d;--red:#b91c1c;--amber:#b45309;--line:#d5deee}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
header h1{font-size:clamp(1.15rem,4.2vw,1.7rem);margin:0;line-height:1.25}
header p{margin:0;color:var(--mut);font-size:.9rem}
.tabs{display:flex;gap:6px;background:#dde6f5;padding:4px;border-radius:12px}
.tab{border:0;background:transparent;font:inherit;font-weight:600;padding:9px 14px;border-radius:9px;color:var(--mut);cursor:pointer;min-height:44px}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}
[hidden]{display:none!important}

}

@layer komponen {
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.prob{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.prob small{color:var(--mut);display:block}
.ineq{font-size:clamp(1.4rem,6vw,2rem);font-weight:700;letter-spacing:.02em}
.prob-actions{display:flex;gap:8px;flex-wrap:wrap}
ol.prog{list-style:none;display:flex;gap:4px;padding:0;margin:0 0 8px}
ol.prog li{flex:1;text-align:center;font-size:.78rem;color:var(--mut)}
ol.prog li span{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 2px;border-radius:50%;background:#e4ebf7;font-weight:700;color:var(--mut)}
ol.prog li.cur span{background:var(--blue);color:#fff}
ol.prog li.cur{color:var(--blue);font-weight:700}
ol.prog li.done span{background:var(--green);color:#fff}
ol.prog em{font-style:normal;display:block}
.steptext{margin:0;font-size:.9rem;color:var(--mut);text-align:center}
h2{font-size:1.2rem;margin:0 0 8px}
.muted{color:var(--mut);font-size:.95rem}
.eq{display:inline-block;background:#eaf0ff;border-radius:8px;padding:0 8px;font-weight:700;white-space:nowrap}
.note{background:#f6f9ff;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:10px 0}
.note p{margin:.3em 0}
.rule{background:#fff8e6;border:1px solid #f3dca0;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.97rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.chip.on{border-color:var(--blue);background:#eaf0ff;color:var(--blue)}
.btn{font:inherit;font-weight:700;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:10px 18px;min-height:48px;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn:disabled,.segb:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
table.tbl{border-collapse:collapse;margin:10px 0;width:100%;max-width:360px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px;text-align:center;font-size:1.1rem}
.tbl th{background:#eaf0ff}
input.num{width:84px;font:inherit;font-size:1.15rem;text-align:center;padding:8px;border:2px solid var(--line);border-radius:10px;min-height:46px}
input.num.ok{border-color:var(--green);background:#ecfdf3}
input.num.bad{border-color:var(--red);background:#fef2f2}
.xy{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:1.3rem;margin:8px 0}
.xy input{width:76px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.segb{font:inherit;font-weight:700;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;color:var(--ink)}
.segb.on{border-color:var(--blue);background:#eaf0ff;color:var(--blue)}
.state{font-weight:600;margin:.4em 0}
.hints{margin:10px 0 0;padding:8px 12px 8px 30px;background:#fff8e6;border:1px solid #f3dca0;border-radius:10px;font-size:.97rem}
.hints[hidden],.fb[hidden]{display:none}
.hints li{margin:.25em 0}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:500}
.fb.ok{background:#ecfdf3;border:1px solid #9be0b8;color:#14532d}
.fb.bad{background:#fef2f2;border:1px solid #f3b4b4;color:#7f1d1d}
.fb.info{background:#eff6ff;border:1px solid #b6d0fb;color:#1e3a8a}
.sub{background:#f6f9ff;border-radius:12px;padding:10px 12px;margin-top:10px}
.sub p{margin:.35em 0}
.calc{font-size:1.1rem;font-weight:600}
.okc{color:var(--green)}.badc{color:var(--red)}
ol.sum{padding-left:22px}
ol.sum li{margin:.5em 0}
.score{font-size:3rem;font-weight:800;color:var(--blue)}
.score small{font-size:1.2rem;color:var(--mut)}
.plane svg{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation;cursor:pointer;background:#fff}
.plane p{margin:6px 0 0;font-size:.85rem;color:var(--mut);text-align:center}
.lbl{font:700 13px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.tick{font:12px system-ui,sans-serif;fill:#44546a;paint-order:stroke;stroke:#fff;stroke-width:3px}
.plane svg.drag{touch-action:none;cursor:grab}
.relb{min-width:60px;padding:8px 12px;font-size:1.25rem}
.sys{display:flex;align-items:center;gap:8px}
.brace{font-size:3.2rem;font-weight:200;line-height:1;color:var(--mut);margin-right:2px}
.srows{display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:8px;font-size:clamp(1.1rem,4.6vw,1.5rem);font-weight:700;padding:1px 10px;border-radius:8px}
.srow i{width:12px;height:12px;border-radius:50%;flex:none}
.srow.cur{background:#eaf0ff}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mini span{font-size:.78rem;padding:3px 10px;border-radius:999px;background:#e4ebf7;color:var(--mut);font-weight:600}
.mini span.cur{background:var(--blue);color:#fff}
.mini span.dn{background:#dcf5e6;color:#14532d}
.sub small{color:var(--mut);font-weight:500}
.ask{margin:4px 0 8px;font-size:1rem}
.lvl{margin:10px 0}
.trow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.trow.ok{background:#ecfdf3;border-color:#9be0b8}
.trow.bad{background:#fef2f2;border-color:#f3b4b4}
.trow .seg{margin:6px 0 0}
.trow p{margin:.3em 0}
.eqin{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.25rem;margin:10px 0}
.eqin .num{width:84px}
/* Latihan dan Kuis: pratinjau "Persamaanmu" di samping isian koefisien */
.eqwrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px}
.eqwrap>.eqin{margin:10px 0}
.pratinjau{display:flex;flex-direction:column;gap:2px;min-width:150px;padding:6px 12px;border:1px dashed var(--line);border-radius:10px;background:#f8fbff}
.pratinjau small{font-size:.78rem;font-weight:700;color:var(--mut)}
.pratinjau .pr-isi{font-size:1.2rem;color:var(--ink);white-space:nowrap}
.trow.ok .pratinjau{border-style:solid;border-color:#9be0b8;background:#fff}
.relb.sel{background:var(--blue);color:#fff}
.relb:disabled.sel{opacity:.9}
input.num.vin{width:96px}

/* ===== Maskot Plus ===== */
:root{--plus-w:90px}
@media(min-width:860px){:root{--plus-w:120px}}
body:not(.plus-off) .wrap{padding-bottom:calc(var(--plus-w)*.93 + 36px)}
#plusWrap{position:fixed;right:8px;bottom:8px;z-index:50;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
body.plus-off #plusWrap{display:none}
#plusBody{position:relative;width:var(--plus-w);flex:none}
#plusBody svg{width:100%;height:auto;display:block;overflow:visible}
#plusBubble{align-self:center;position:relative;max-width:min(190px,52vw);background:#fff;color:var(--ink);border:2px solid var(--blue);border-radius:14px;padding:7px 11px;font-weight:700;font-size:.86rem;line-height:1.3;box-shadow:0 2px 8px rgba(29,78,216,.18);opacity:0;visibility:hidden;transform:translateX(8px) scale(.92);transform-origin:right center;transition:opacity .25s,transform .25s,visibility 0s .25s}
#plusBubble.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#plusBubble::after{content:"";position:absolute;right:-8px;top:50%;width:12px;height:12px;background:#fff;border-right:2px solid var(--blue);border-top:2px solid var(--blue);transform:translateY(-50%) rotate(45deg)}
@media(min-width:860px){#plusBubble{max-width:240px;font-size:.95rem}}
#plusToggle{position:fixed;z-index:51;right:8px;bottom:calc(var(--plus-w)*.93 + 12px);width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--mut);font:700 14px/1 system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
body.plus-off #plusToggle{bottom:8px;width:auto;height:44px;border-radius:999px;padding:0 16px;border-color:var(--blue);color:var(--blue);font-size:.95rem}
/* ekspresi */
#plusWrap .eyeH,#plusWrap .mH,#plusWrap .mS,#plusWrap .brow{display:none}
#plusWrap[data-mood=happy] .eye,#plusWrap[data-mood=happy] .mN,#plusWrap[data-mood=happy] .mS{display:none}
#plusWrap[data-mood=happy] .eyeH,#plusWrap[data-mood=happy] .mH{display:inline}
#plusWrap[data-mood=sad] .mN{display:none}
#plusWrap[data-mood=sad] .mS,#plusWrap[data-mood=sad] .brow{display:inline}
/* animasi */
#plusChar{transform-origin:70px 72px;animation:plusFloat 3.2s ease-in-out infinite}
#armL{transform-origin:30px 64px}
#armR{transform-origin:110px 64px}
.eye{transform-box:fill-box;transform-origin:center;animation:plusBlink 4.8s infinite}
#plusWrap[data-act=wave] #armR{animation:plusWave 2.2s ease-in-out 1}
#plusWrap[data-act=cheer] #plusChar{animation:plusJump 1s ease-out 1}
#plusWrap[data-act=cheer] #armL{animation:plusUpL 1.4s ease-in-out 1}
#plusWrap[data-act=cheer] #armR{animation:plusUpR 1.4s ease-in-out 1}
#plusWrap[data-act=shake] #plusChar{animation:plusShake 1.1s ease-in-out 1}
#plusWrap[data-act=point] #armL{animation:plusPoint 1.8s ease-in-out 1}
#plusWrap[data-act=spin] #plusChar{animation:plusSpin 1.1s ease-in-out 1}
#plusWrap[data-act=spin] #armL{animation:plusUpL 1.6s ease-in-out 1}
#plusWrap[data-act=spin] #armR{animation:plusUpR 1.6s ease-in-out 1}
@keyframes plusFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes plusBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes plusWave{0%{transform:rotate(0)}15%{transform:rotate(-100deg)}30%{transform:rotate(-124deg)}45%{transform:rotate(-96deg)}60%{transform:rotate(-124deg)}75%{transform:rotate(-96deg)}90%{transform:rotate(-100deg)}100%{transform:rotate(0)}}
@keyframes plusUpL{0%{transform:rotate(0)}20%,80%{transform:rotate(105deg)}100%{transform:rotate(0)}}
@keyframes plusUpR{0%{transform:rotate(0)}20%,80%{transform:rotate(-105deg)}100%{transform:rotate(0)}}
@keyframes plusPoint{0%{transform:rotate(0)}20%{transform:rotate(75deg)}35%{transform:rotate(66deg)}50%{transform:rotate(78deg)}65%{transform:rotate(66deg)}85%{transform:rotate(75deg)}100%{transform:rotate(0)}}
@keyframes plusJump{0%,100%{transform:translateY(0)}25%{transform:translateY(-22px)}50%{transform:translateY(0)}65%{transform:translateY(-9px)}80%{transform:translateY(0)}}
@keyframes plusShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
@keyframes plusSpin{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-16px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
/* konfeti */
#plusConf{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
#plusConf i{position:absolute;width:7px;height:10px;border-radius:2px;animation:plusConf 1.5s ease-out forwards}
@keyframes plusConf{0%{transform:translate(0,0) rotate(0);opacity:1}60%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 50px)) rotate(var(--rot));opacity:0}}
/* hormati prefers-reduced-motion: tanpa gerak, pose statis saja */
@media (prefers-reduced-motion:reduce){
  #plusChar,#armL,#armR,.eye,#plusConf i{animation:none!important}
  #plusBubble{transition:none!important}
  #plusWrap[data-act=wave] #armR,#plusWrap[data-act=cheer] #armR,#plusWrap[data-act=spin] #armR{transform:rotate(-105deg)}
  #plusWrap[data-act=cheer] #armL,#plusWrap[data-act=spin] #armL{transform:rotate(105deg)}
  #plusWrap[data-act=point] #armL{transform:rotate(75deg)}
}


.exbox{margin:8px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#f8fafc}
.exbox.why{border-color:#f3b5b5;background:#fff1f1}
.exbox.fix{border-color:#a7dcb8;background:#effaf2}
table.ext{width:100%;border-collapse:collapse;font-size:.93rem;margin:6px 0}
table.ext th,table.ext td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.ext th{background:#e8f0fb}
.panel .exl .eq,.panel p.eq,.ans{white-space:normal;overflow-wrap:anywhere}
@media (max-height:559px){#exFloat .exfpos{display:none}}
/* ===== Rumus persamaan garis (KaTeX): hanya berlaku setelah rumus dirender ===== */
[data-tex]>.katex{font-size:1.1em;line-height:1.2;white-space:nowrap}
.eq[data-tex]:has(>.katex){max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;padding-top:3px;padding-bottom:3px;-webkit-overflow-scrolling:touch}
span[data-tex]:not(.eq):has(>.katex){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;padding:2px 0}
.panel p.eq[data-tex]:has(>.katex){white-space:nowrap}
.sol:has(.katex){min-height:44px}
}

@layer tata-letak {
.layout{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.layout{grid-template-columns:minmax(340px,1fr) minmax(380px,520px);align-items:start}.plane{position:sticky;top:10px}}
@media (max-width:859px){.layout>*{min-width:0}}
/* ===== Tampilan ringkas PC/laptop: satu layar, tanpa gulir halaman ===== */
@media (min-width:860px) and (min-height:500px){
  body{--res:calc(var(--plus-w)*.93 + 50px);--ps:clamp(300px,min(calc(100vh - 88px - var(--res)),calc(100vw - 480px)),640px)}
  body.plus-off{--res:0px}
  html,body{height:100%}
  body{overflow:hidden;font-size:15px;line-height:1.45}
  body .wrap,body:not(.plus-off) .wrap{height:100vh;max-width:1320px;padding:8px 14px;display:flex;flex-direction:column}
  header{margin:0 0 6px;gap:6px}
  header>div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  header h1{font-size:1.15rem}
  header p{font-size:.82rem}
  .tabs{padding:3px}
  .tab{min-height:34px;padding:4px 12px}
  main{flex:1;min-height:0}
  /* setiap tab: kolom kiri (kartu, progres, panel) dan kolom kanan (bidang) */
  .tab-view{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr);column-gap:12px}
  .tab-view>.kartu{grid-column:1;grid-row:1}
  .tab-view>.progres{grid-column:1;grid-row:2}
  .tab-view .layout{display:contents}
  .tab-view .panel{grid-column:1;grid-row:3;overflow:auto;min-height:0;margin-bottom:0}
  .tab-view .plane{grid-column:2;grid-row:1/4;align-self:start;position:static;padding:8px;margin:0}
  .plane svg{width:var(--ps);height:var(--ps)}
  .plane p{display:none}
  .card{padding:10px 14px;margin-bottom:6px;border-radius:12px}
  .prob{flex-wrap:nowrap;gap:12px;align-items:center}
  .prob>div:first-child{flex:1;min-width:0}
  .prob-actions{flex-direction:column;gap:4px}
  .prob-actions .btn{min-height:32px;padding:3px 10px;font-size:.82rem;border-radius:9px}
  .progres{padding:4px 10px}
  ol.prog{margin:0}
  ol.prog li{font-size:.72rem}
  ol.prog li span{width:24px;height:24px;font-size:.78rem}
  .steptext{display:none}
  .panel h2{font-size:1.05rem;margin:0 0 2px}
  .panel p{margin:.25em 0}
  .btn{min-height:38px;padding:5px 14px;border-radius:10px}
  .chip{min-height:32px;padding:3px 12px}
  .segb{min-height:36px;padding:2px 12px}
  .relb{min-width:48px;min-height:34px;padding:2px 10px;font-size:1.1rem}
  input.num{min-height:38px;padding:4px;font-size:1.05rem}
  input.num.vin{width:84px}
  .eqin .num{width:72px}
  .row{margin-top:8px}
  .note{margin:6px 0;padding:4px 10px}
  .rule{margin:6px 0;padding:5px 10px;font-size:.9rem}
  .chips{margin:4px 0;gap:6px}
  .lvl{margin:4px 0;display:flex;align-items:center;gap:10px}
  .lvl>b{flex:0 0 150px}
  .lvl .chips{margin:0}
  .mini{margin:0 0 6px}
  .hints{margin:4px 0 0;padding:5px 10px 5px 26px;font-size:.85rem}
  .fb{margin-top:6px;padding:5px 10px;line-height:1.35}
  .trow{padding:6px 10px;margin:4px 0}
  .eqin,.xy{margin:6px 0;font-size:1.1rem}
  .seg{margin:6px 0}
  .calc{font-size:1rem}
  .score{font-size:2.4rem}
  ol.sum li{margin:.3em 0}
  .trow:has(.seg),.trow:has(.opb){display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
  .trow:has(.seg)>.seg{margin:0}
  .trow:has(.opb)>p{margin:0;font-size:.85rem}
}
@media (min-width:860px) and (max-height:720px){:root{--plus-w:100px}}
}

@layer tab {
.whereBox{margin-top:6px}
#whereTxt{display:block;margin-top:4px;font-weight:600}
#plusFx{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:49;pointer-events:none;overflow:visible}
#plusFx .ring{fill:rgba(245,158,11,.14);stroke:#f59e0b;stroke-width:4;animation:fxPulse 1.4s ease-in-out infinite}
@keyframes fxPulse{50%{stroke-opacity:.45}}
#plusFx .beam{stroke:#f59e0b;stroke-width:3;stroke-dasharray:7 6;fill:none;marker-end:url(#fxArr)}
#plusWrap.go{transition:transform .65s cubic-bezier(.4,0,.2,1)}
#plusWrap[data-side=r]{flex-direction:row-reverse}
#plusWrap[data-side=r] #plusBubble{transform-origin:left center}
#plusWrap[data-side=r] #plusBubble::after{right:auto;left:-8px;border-right:0;border-top:0;border-left:2px solid var(--blue);border-bottom:2px solid var(--blue)}
@media(prefers-reduced-motion:reduce){#plusWrap.go{transition:none!important}#plusFx .ring{animation:none}}

/* ===== Tab Belajar: tombol Sebelumnya / Berikutnya / Ulangi melayang di perangkat kecil ===== */
#exFloat{display:contents}
#exFloat .exfpos{display:none}

function norm(a,b,c){var g=gcd(gcd(a,b),c)||1;a/=g;b/=g;c/=g;if(a<0||(a===0&&b<0)){a=-a;b=-b;c=-c;}return L(a+0,b+0,c+0);}

/* ---------- transformasi ---------- */
var O0={x:0,y:0};
function P2(x,y){return {x:rnd(x),y:rnd(y)};}
function rot(P,d,C){
  C=C||O0;d=((d%360)+360)%360;var x=P.x-C.x,y=P.y-C.y,r;
  if(d===90)r=[-y,x];else if(d===180)r=[-x,-y];else if(d===270)r=[y,-x];else r=[x,y];
  return P2(r[0]+C.x,r[1]+C.y);
}
function dil(P,k,C){C=C||O0;return P2(C.x+k*(P.x-C.x),C.y+k*(P.y-C.y));}
/* garis ax + by = c dirotasi atau didilatasi dengan pusat O */
function rotLn(q,d){d=((d%360)+360)%360;return d===90?L(-q.b,q.a,q.c):d===180?L(q.a,q.b,-q.c):d===270?L(q.b,-q.a,q.c):L(q.a,q.b,q.c);}
function dilLn(q,k){return L(q.a,q.b,rnd(k*q.c));}
var ATURAN={90:'(−y, x)',180:'(−x, −y)',270:'(y, −x)'};
var HUBUNGAN={90:'x′ = −y dan y′ = x',180:'x′ = −x dan y′ = −y',270:'x′ = y dan y′ = −x'};
var SUBST={90:'x = y′, y = −x′',180:'x = −x′, y = −y′',270:'x = −y′, y = x′'};
function degS(d){return nm(d)+'°';}

/* ---------- penilaian satu langkah ---------- */
function propEq(k,a,b,c){
  if(!isNum(a)||!isNum(b)||!isNum(c)||(a===0&&b===0))return false;
  var e=1e-9;
  return Math.abs(k.a*b-a*k.b)<e&&Math.abs(k.a*c-a*k.c)<e&&Math.abs(k.b*c-b*k.c)<e;
}
function judgeItem(it,a){
  if(it.t==='pg')return a===it.key;
  if(it.t==='num')return isNum(a)&&Math.abs(a-it.key)<1e-6;
  if(it.t==='eq')return Array.isArray(a)&&a.length===3&&propEq(it.key,a[0],a[1],a[2]);
  return false;
}
function validItem(it,a){
  if(it.t==='pg')return isInt(a)&&a>=0&&a<it.o.length;
  if(it.t==='num')return isNum(a)&&Math.abs(a)<1e9;
  if(it.t==='eq')return Array.isArray(a)&&a.length===3&&a.every(function(v){return isNum(v)&&Math.abs(v)<1e9;});
  return false;
}
function inBox(p,B){return !!p&&typeof p==='object'&&isInt(p.x)&&isInt(p.y)&&p.x>=B.x0&&p.x<=B.x1&&p.y>=B.y0&&p.y<=B.y1;}
function samePt(p,q){return p.x===q.x&&p.y===q.y;}
function uniq(arr){var o=[];arr.forEach(function(p){if(!o.some(function(r){return samePt(r,p);}))o.push(p);});return o;}
/* jawaban mentah sah? (jika tidak, peristiwa diabaikan dan tidak dihitung sebagai percobaan) */
function valid(Q,s,a){
  var S=Q.st[s];if(!S)return false;
  if(S.k==='form')return Array.isArray(a)&&a.length===S.it.length&&S.it.every(function(it,i){return validItem(it,a[i]);});
  if(S.k==='pt')return inBox(a,Q.pl);
  if(S.k==='pts'){
    if(!Array.isArray(a)||a.length<1||a.length>16)return false;
    if(!a.every(function(p){return inBox(p,Q.pl);}))return false;
    return uniq(a.slice()).length===a.length;
  }
  return false;
}
function judgePt(c,p){return c.k==='at'&&c.p.some(function(q){return samePt(q,p);});}
/* hasil: {ok, items:[bool]} untuk form; {ok} untuk pt; {ok, kurang, lebih} untuk pts */
function judge(Q,s,a){
  var S=Q.st[s];
  if(S.k==='form'){var r=S.it.map(function(it,i){return judgeItem(it,a[i]);});return {ok:r.every(Boolean),items:r};}
  if(S.k==='pt')return {ok:judgePt(S.cond,a)};
  var kurang=S.key.filter(function(p){return !a.some(function(q){return samePt(p,q);});});
  var lebih=a.filter(function(p){return !S.key.some(function(q){return samePt(p,q);});});
  return {ok:!kurang.length&&!lebih.length,kurang:kurang,lebih:lebih};
}
/* jawaban kunci untuk satu langkah */
function keyAns(Q,s){
  var S=Q.st[s];
  if(S.k==='form')return S.it.map(function(it){return it.t==='eq'?[it.key.a,it.key.b,it.key.c]:it.key;});
  if(S.k==='pt')return {x:S.cond.p[0].x,y:S.cond.p[0].y};
  return S.key.map(function(p){return {x:p.x,y:p.y};});
}
/* jawaban salah yang sah (untuk cek()) */
function wrongAns(Q,s){
  var S=Q.st[s],a=keyAns(Q,s);
  if(S.k==='form'){
    var it=S.it[0],w=a.slice();
    if(it.t==='pg')w[0]=(it.key+1)%it.o.length;
    else if(it.t==='num')w[0]=it.key+1;
    else w[0]=[it.key.a,it.key.b,it.key.c+1];
    return w;
  }
  var geser=function(p){return {x:p.x===Q.pl.x1?p.x-1:p.x+1,y:p.y};};
  if(S.k==='pt')return geser(a);
  var g=geser(a[0]);
  return a.slice(1).filter(function(p){return !samePt(p,g);}).concat([g]);
}

/* ---------- pembentuk langkah ---------- */
function F(nm_,q,it,h,v,lay){return {nm:nm_,k:'form',q:q,it:it,h:h||[],v:v||{},lay:lay||''};}
function PT(nm_,q,p,h,v){return {nm:nm_,k:'pt',q:q,cond:{k:'at',p:[{x:p.x,y:p.y}]},h:h||[],v:v||{}};}
function PS(nm_,q,key,h,v){return {nm:nm_,k:'pts',q:q,key:key.map(function(p){return {x:p.x,y:p.y};}),h:h||[],v:v||{}};}
function pg(lab,o,key){return {t:'pg',lab:lab,o:o,key:key};}
function num(lab,key,u){return {t:'num',lab:lab,key:rnd(key),u:u||''};}
function eqI(lab,k,pts){return {t:'eq',lab:lab,key:{a:k.a,b:k.b,c:k.c},pts:pts||[]};}
/* pilihan ganda: jawaban + paling banyak 3 pengecoh (pengecoh yang sama dengan jawaban atau kembar dibuang) */
function pgS(rng,lab,key,dis){
  var d=[];dis.forEach(function(x){if(x!==key&&d.indexOf(x)<0&&d.length<3)d.push(x);});
  var o=shuffle([key].concat(d),rng);return pg(lab,o,o.indexOf(key));
}
/* sepasang isian koordinat (x, y) dengan layout 'koor' */
function kr(lab,P){return [{t:'num',lab:lab,key:rnd(P.x),u:'',ax:'x'},{t:'num',lab:'',key:rnd(P.y),u:'',ax:'y'}];}
function FK(nm_,q,pairs,h,v){var it=[];pairs.forEach(function(p){it=it.concat(kr(p[0],p[1]));});return F(nm_,q,it,h,v,'koor');}

/* ---------- pembentuk tampilan bidang ---------- */
function mk(P,c,l){return {x:P.x,y:P.y,c:c||'k',l:l===undefined?'':l};}
function mkN(P,c,nama){return mk(P,c,nama+ptS(P));}
function poly(ps,c,nama){return {p:ps.map(function(P){return [P.x,P.y];}),c:c,l:nama||[]};}
function seg(A,B,c,dash){return {a:[A.x,A.y],b:[B.x,B.y],c:c||'k',d:dash?1:0};}
function arc(C,A,deg,c){return {c:[C.x,C.y],a:[A.x,A.y],deg:deg,col:c||'k'};}
function lnV(q,c,lbl){return {a:q.a,b:q.b,c:q.c,col:c||'a',l:lbl===undefined?'':lbl};}
function ctr(P,l){return {x:P.x,y:P.y,l:l===undefined?((P.x||P.y)?'P'+ptS(P):'O'):l};}
function mkQ(t,l,v,o){
  return {t:t,l:l,v:v,bg:BG_TIPE[t],jd:'Tipe '+t+' · '+TIPE[t],lv:LEVEL[l],kko:o.kko,soal:o.soal,pl:o.pl||FULL,
    st:o.st||[],vz:o.vz||{},bahas:o.bahas||[]};
}
/* gabungan tampilan: salin lalu timpa */
function V(){var r={};for(var i=0;i<arguments.length;i++){var o=arguments[i]||{};for(var k in o)if(o[k]!==undefined&&o[k]!==null)r[k]=o[k];}return r;}
var CAP_R='Biru = asal, jingga = bayangan. Panah melengkung menunjukkan arah putaran.';
var CAP_D='Biru = asal, jingga = bayangan. Garis putus-putus melewati pusat dilatasi.';
var CAP_G='Garis biru = garis asal, garis jingga = garis bayangan.';

/* ================= A. ROTASI TITIK DAN BANGUN (Tipe 1–7) ================= */
/* titik acak dengan koordinat bulat dari [-m, m] selain 0 */
function titik(rng,m,syarat){
  for(var i=0;i<200;i++){var P={x:rnz(rng,-m,m),y:rnz(rng,-m,m)};if(!syarat||syarat(P))return P;}
  return {x:2,y:1};
}
function vRot(A,nA,d,o){

    arc:o.B?arc(C,A,o.arah||d,'b'):undefined,cap:CAP_R});
}
var DIS_ATURAN={90:['(y, −x)','(−x, −y)','(y, x)'],180:['(−y, x)','(x, −y)','(−x, y)'],270:['(−y, x)','(−x, −y)','(x, −y)']};

}

function g4(rng,v){

  '20M':['a','b','c'],'21H':['a','b'],'22M':['a'],'23H':['a'],'24H':['a','b']
};
var VARS_LATIHAN={};   /* varian khusus Latihan Mandiri (belum ada) */
function levels(t){return (LV_TIPE[t]||'').split('');}
function variants(t,l,latihan){var k=t+l;return (VARS[k]||[]).concat(latihan&&VARS_LATIHAN[k]?VARS_LATIHAN[k]:[]);}
function gen(t,l,rng,latihan,v){
  if(!l||levels(t).indexOf(l)<0)l=levels(t)[0];
  if(!v)v=pick(rng,variants(t,l,latihan));
  return GEN[t](rng,v);
}

/* Satu "paket kuis" ditentukan sepenuhnya oleh benih (seed): 12 soal sesuai SUSUNAN_KUIS.
   Varian setiap soal dipilih acak dari benih yang sama. */
var SUSUNAN_KUIS=[[1,'L'],[3,'M'],[5,'H'],[6,'H'],[9,'L'],[10,'M'],[12,'M'],[16,'H'],[18,'M'],[20,'M'],[22,'M'],[24,'H']];
function buildPack(seed){
  var rng=mulberry32(seed),set=[];
  SUSUNAN_KUIS.forEach(function(x){set.push(gen(x[0],x[1],rng,false,x[2]));});
  return {seed:seed,set:set};
}

/* ---------- penilai jejak jawaban ----------
   jejak = daftar peristiwa {p,s,a,t}: p = nomor soal, s = nomor langkah, a = jawaban mentah,
   t = waktu (ms sejak mulai). Hanya jawaban mentah yang dipercaya; benar-salahnya dihitung ulang di sini.
   Setiap langkah paling banyak MAKS_COBA percobaan: benar ke-1 = 2 poin, benar ke-2 = 1 poin, salah dua kali = 0.
   Jawaban berformat tidak sah diabaikan, tidak dihitung percobaan. */
function posLangkah(Qs,c){
  for(var p=0;p<Qs.length;p++){if(c<Qs[p].st.length)return {p:p,s:c};c-=Qs[p].st.length;}
  return {p:Qs.length,s:0};
}
function gradeTrace(pack,trace){
  var Qs=pack.set,ev=Array.isArray(trace)?trace:[],total=0;
  Qs.forEach(function(Q){total+=Q.st.length;});
  var c=0,tries=0,score=0,ignored=0,steps=[],missed={},lastT=0,mono=true,rinci={};
  RINCI.forEach(function(k){rinci[k]=[0,0];});
  Qs.forEach(function(Q){rinci[Q.bg][1]+=2*Q.st.length;rinci[LEVEL[Q.l]][1]+=2*Q.st.length;});
  function close(pts){
    var ps=posLangkah(Qs,c),Q=Qs[ps.p],S=Q.st[ps.s];
    steps.push(pts);score+=pts;rinci[Q.bg][0]+=pts;rinci[LEVEL[Q.l]][0]+=pts;
    if(pts<2){var k='Tipe '+Q.t+' · '+S.nm;missed[k]=(missed[k]||0)+1;}
    c++;tries=0;
  }
  for(var k=0;k<ev.length;k++){
    var e=ev[k];
    if(!e||typeof e!=='object'){ignored++;continue;}
    if(isNum(e.t)){if(e.t<lastT)mono=false;else lastT=e.t;}
    if(c>=total){ignored++;continue;}
    var ps=posLangkah(Qs,c),p=ps.p,s=ps.s;
    if(e.p!==p||e.s!==s||!valid(Qs[p],s,e.a)){ignored++;continue;}
    tries++;
    if(judge(Qs[p],s,e.a).ok)close(tries===1?2:1);
    else if(tries>=MAKS_COBA)close(0);
  }
  var now=posLangkah(Qs,c);
  return {score:score,max:total*2,done:c,total:total,p:now.p,s:now.s,complete:c===total,tries:tries,ignored:ignored,steps:steps,missed:missed,rinci:rinci,monotonic:mono,lastT:lastT};
}

/* ---------- sidik jari kode: halaman dan server harus menghasilkan nilai yang sama ---------- */
function djb2(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(16);}
function semuaVarian(){var o=[];for(var t=1;t<=24;t++)levels(t).forEach(function(l){variants(t,l,true).forEach(function(v){o.push([t,l,v]);});});return o;}
function cek(){
  var pk=buildPack(20261102),rng=mulberry32(7),vs=[],sm=[],t=0;
  semuaVarian().forEach(function(x){vs.push(gen(x[0],x[1],rng,true,x[2]));});
  pk.set.forEach(function(Q,p){
    for(var s=0;s<Q.st.length;s++){
      var m=(p+s)%3;
      if(m===0){sm.push({p:p,s:s,a:wrongAns(Q,s),t:++t});sm.push({p:p,s:s,a:keyAns(Q,s),t:++t});}
      else if(m===1){sm.push({p:p,s:s,a:null,t:++t});sm.push({p:p,s:s,a:keyAns(Q,s),t:++t});}
      else{sm.push({p:p,s:s,a:wrongAns(Q,s),t:++t});sm.push({p:p,s:s,a:wrongAns(Q,s),t:++t});}
    }
  });
  sm.push({p:99,s:9,a:1,t:++t});
  var vj=vs.map(function(Q){return Q.st.map(function(S,s){return [judge(Q,s,keyAns(Q,s)).ok,judge(Q,s,wrongAns(Q,s)).ok];});});
  return VERSI+':'+djb2(JSON.stringify({pk:pk,vs:vs,vj:vj,g:gradeTrace(pk,sm)}));
}

/* ---------- uji mandiri: CORE.uji() di konsol ----------
   Membangkitkan setiap varian berkali-kali dan memeriksa: kunci dinilai benar, jawaban salah dinilai salah,
   titik jawaban di dalam bidang, pilihan ganda tanpa opsi kembar, dan tidak ada NaN/undefined pada teks. */
function uji(n){
  n=n||300;var lap=[],rng=mulberry32(2026);
  semuaVarian().forEach(function(x){
    for(var i=0;i<n;i++){
      var Q=gen(x[0],x[1],rng,true,x[2]),id='T'+x[0]+x[1]+x[2]+'#'+i;
      if(/NaN|undefined|Infinity|null/.test(JSON.stringify(Q)))lap.push(id+' teks tidak sah');
      Q.st.forEach(function(S,s){
        var ka=keyAns(Q,s),wa=wrongAns(Q,s);
        if(!valid(Q,s,ka))lap.push(id+' L'+(s+1)+' kunci tidak sah '+JSON.stringify(ka));
        else if(!judge(Q,s,ka).ok)lap.push(id+' L'+(s+1)+' kunci dinilai salah');
        if(valid(Q,s,wa)&&judge(Q,s,wa).ok)lap.push(id+' L'+(s+1)+' jawaban salah dinilai benar');
        if(S.k==='form')S.it.forEach(function(it){
          if(it.t==='pg'){if(it.o.length<2)lap.push(id+' L'+(s+1)+' opsi kurang');if(it.o.some(function(o,j){return it.o.indexOf(o)!==j;}))lap.push(id+' L'+(s+1)+' opsi kembar');}
        });
      });
    }
  });
  return lap.length?lap.slice(0,40):'Semua soal aman.';
}

return {VERSI:VERSI,OPS:OPS,MAKS_COBA:MAKS_COBA,NSOAL:NSOAL,NLANGKAH:NLANGKAH,TIPE:TIPE,LEVEL:LEVEL,LV_TIPE:LV_TIPE,
  BAGIAN:BAGIAN,BG_TIPE:BG_TIPE,RINCI:RINCI,RLAB:RLAB,FULL:FULL,
  isSolid:isSolid,holds:holds,flipOp:flipOp,gcd:gcd,mulberry32:mulberry32,
  nm:nm,rp:rp,lin:lin,eqS:eqS,ineqS:ineqS,zeroS:zeroS,ymS:ymS,sum:sum,ptS:ptS,L:L,norm:norm,
  rot:rot,dil:dil,rotLn:rotLn,dilLn:dilLn,ATURAN:ATURAN,SUBST:SUBST,
  levels:levels,variants:variants,gen:gen,buildPack:buildPack,posLangkah:posLangkah,SUSUNAN_KUIS:SUSUNAN_KUIS,
  valid:valid,judge:judge,judgePt:judgePt,keyAns:keyAns,wrongAns:wrongAns,gradeTrace:gradeTrace,cek:cek,uji:uji};
})();

</script>
<script>
/* ==========================================================================
   komponen.js · KOMPONEN BERSAMA
   Dipakai oleh semua tab. Tidak berisi logika khusus satu tab.
   - PL.U        : utilitas kecil (pilih elemen, format angka)

   ========================================================================== */
(function(PL){

var U=PL.U={};

function modeNow(){return document.body.dataset.mode||'belajar';}
PL.mode=modeNow;

/* ---------- PL.Bidang: bidang koordinat berskala ----------
   var b=PL.Bidang(svgEl, capEl);  b.gambar(V);  b.klik(e) → {mx,my,vx,vy};  b.tempel(c) → titik kisi
   V = {B (kotak bidang), mk:[{x,y,c,l,h}], poly:[{p:[[x,y]…],c,l:[nama titik]}], seg:[{a:[x,y],b:[x,y],c,d}],

        sel:[titik terpilih], pick:titik, click:bool, cap:teks}
   Kode warna: a = asal (biru), b = bayangan (jingga), m = antara (ungu), k = hitam, g = hijau, r = merah. */
var KC={a:'#1d4ed8',b:'#c2410c',m:'#7e22ce',k:'#1b2a41',g:'#15803d',r:'#b91c1c',o:'#b45309',c:'#92400e'};
var KF={a:'rgba(29,78,216,.13)',b:'rgba(194,65,12,.16)',m:'rgba(126,34,206,.14)',k:'rgba(27,42,65,.08)',g:'rgba(21,128,61,.16)'};
var CAP_BAWAAN='Biru = asal, jingga = bayangan.';
PL.Bidang=function(svg,cap){
  var N=460,MG=30,PB=CORE.FULL,PK=(N-2*MG)/20;
  function setBox(B){PB=B;PK=(N-2*MG)/(B.x1-B.x0);}
  function sx(x){return MG+(x-PB.x0)*PK;}
  function sy(y){return N-MG-(y-PB.y0)*PK;}
  function f1(v){return (+v).toFixed(1);}

    if(q.a!==0)[B.y0,B.y1].forEach(function(y){var x=(q.c-q.b*y)/q.a;if(x>=B.x0-e&&x<=B.x1+e)pts.push([x,y]);});

  function ptLbl(p,t,col){var X=sx(p.x),Y=sy(p.y),rt=X>330,up=Y>40;return teks(rt?X-10:X+10,up?Y-10:Y+20,t,col,rt?'end':'start');}
  function warna(c){return KC[c]||KC.k;}
  function gambar(V){
    V=V||{};var B=V.B||CORE.FULL;setBox(B);
    var s='',i,g=B.g||1,lb=B.lb||g,id=svg.id;
    s+='<defs>'+['k','a','b','m'].map(function(c){return '<marker id="ar'+c+'-'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+warna(c)+'"/></marker>';}).join('')+'</defs>';
    s+='<rect width="'+N+'" height="'+N+'" fill="#fff"/><g stroke="#dbe4f3" stroke-width="1">';
    for(i=Math.ceil(B.x0/g)*g;i<=B.x1+1e-9;i+=g)s+='<line x1="'+f1(sx(i))+'" y1="'+f1(sy(B.y0))+'" x2="'+f1(sx(i))+'" y2="'+f1(sy(B.y1))+'"/>';
    for(i=Math.ceil(B.y0/g)*g;i<=B.y1+1e-9;i+=g)s+='<line x1="'+f1(sx(B.x0))+'" y1="'+f1(sy(i))+'" x2="'+f1(sx(B.x1))+'" y2="'+f1(sy(i))+'"/>';
    s+='</g>';
    s+='<line x1="'+f1(sx(B.x0)-4)+'" y1="'+f1(sy(0))+'" x2="'+f1(sx(B.x1)+14)+'" y2="'+f1(sy(0))+'" stroke="#1b2a41" stroke-width="2" marker-end="url(#ark-'+id+')"/>';
    s+='<line x1="'+f1(sx(0))+'" y1="'+f1(sy(B.y0)+4)+'" x2="'+f1(sx(0))+'" y2="'+f1(sy(B.y1)-14)+'" stroke="#1b2a41" stroke-width="2" marker-end="url(#ark-'+id+')"/>';
    s+='<text class="lbl" x="'+f1(sx(B.x1)+10)+'" y="'+f1(sy(0)+20)+'" style="font-style:italic">x</text><text class="lbl" x="'+f1(sx(0)+9)+'" y="'+f1(sy(B.y1)-4)+'" style="font-style:italic">y</text>';
    for(i=Math.ceil(B.x0/lb)*lb;i<=B.x1-1e-9;i+=lb){if(i===0)continue;s+='<text class="tick" x="'+f1(sx(i))+'" y="'+f1(sy(0)+16)+'" text-anchor="middle">'+nm(i)+'</text>';}
    for(i=Math.ceil(B.y0/lb)*lb;i<=B.y1-1e-9;i+=lb){if(i===0)continue;s+='<text class="tick" x="'+f1(sx(0)-6)+'" y="'+f1(sy(i)+4)+'" text-anchor="end">'+nm(i)+'</text>';}
    s+='<text class="tick" x="'+f1(sx(0)-6)+'" y="'+f1(sy(0)+16)+'" text-anchor="end">0</text>';
    /* lingkaran lintasan */
    if(V.circ){var cc=V.circ;s+='<circle cx="'+f1(sx(cc.c[0]))+'" cy="'+f1(sy(cc.c[1]))+'" r="'+f1(cc.r*PK)+'" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>';}
    /* bangun */
    (V.poly||[]).forEach(function(P){
      var col=warna(P.c);

      P.p.forEach(function(q,j){

      if(Ln.l){

    (V.mk||[]).forEach(function(m){

    });
    if(V.pick){var P=V.pick,X2=sx(P.x),Y2=sy(P.y);s+='<circle cx="'+f1(X2)+'" cy="'+f1(Y2)+'" r="14" fill="rgba(245,158,11,.25)" stroke="#f59e0b" stroke-width="3"/><circle cx="'+f1(X2)+'" cy="'+f1(Y2)+'" r="5.5" fill="#b45309" stroke="#fff" stroke-width="2"/>'+ptLbl(P,ptS(P),'#b45309');}
    svg.innerHTML=s;

  }
  return {
    gambar:gambar,
    /* posisi klik → koordinat bidang */
    klik:function(e){var r=svg.getBoundingClientRect();var vx=(e.clientX-r.left)/r.width*N,vy=(e.clientY-r.top)/r.height*N;return {vx:vx,vy:vy,mx:PB.x0+(vx-MG)/PK,my:PB.y0+(N-MG-vy)/PK};},

function teksIsian(v){

  for(var d=2;d<=12;d++){var n=v*d;if(Math.abs(n-Math.round(n))<1e-9){var dec=String(Math.round(v*1000)/1000);

  return String(Math.round(v*1000)/1000).replace('.',',').replace('-','−');

    }
    if(it.t==='num'){
      return '<div class="trow'+(lk?' ok':'')+'" data-i="'+i+'"><label class="nrow"><span>'+esc(it.lab)+'</span> <span class="nin">'+(it.u==='rp'?'Rp ':'')+inpNum(i)+(it.u&&it.u!=='rp'?' <span class="sat">'+esc(it.u)+'</span>':'')+'</span></label></div>';
    }
    var inp=function(j,ph){return '<input class="num" data-i="'+i+'" data-j="'+j+'" inputmode="text" autocomplete="off" value="'+esc(a[j])+'" placeholder="'+ph+'"'+dis+' aria-label="'+ph+'">';};
    var baris='<div class="eqin">'+inp(0,'a')+'<i>x</i> + '+inp(1,'b')+'<i>y</i> <b>=</b> '+inp(2,'c')+'</div>';
    if(opsi.pratinjau)baris='<div class="eqwrap">'+baris+'<div class="pratinjau" data-pr="'+i+'"><small>Persamaanmu</small><span class="pr-isi"></span></div></div>';
    return '<div class="trow'+(lk?' ok':'')+'" data-i="'+i+'"><p>'+esc(it.lab)+'</p>'+baris+'</div>';
  }
  /* pasangan koordinat: label ( x , y ) */
  function koorHTML(St){
    var h='';
    for(var i=0;i+1<St.it.length;i+=2){
      var ok=S.lock[i]&&S.lock[i+1];
      h+='<div class="trow koor'+(ok?' ok':'')+'" data-i="'+i+'" data-k="'+i+'"><span class="klab">'+esc(St.it[i].lab)+'</span>'
        +'<span class="kin"><span class="kur">(</span>'+inpNum(i,St.it[i].lab+', nilai x')+'<span class="kom">,</span>'+inpNum(i+1,St.it[i].lab+', nilai y')+'<span class="kur">)</span></span></div>';
    }
    return h;
  }
  function selText(){return S.sel.length?'Titik yang dipilih: <b>'+S.sel.map(ptS).join(', ')+'</b>':'<span class="muted">Belum ada titik yang dipilih.</span>';}
  /* ---- pratinjau "Persamaanmu": isian a, b, c ditampilkan sebagai rumus (aktif bila opsi.pratinjau) ---- */
  function bentukPratinjau(a){
    var bag=[0,1,2].map(function(j){var s=String(a[j]==null?'':a[j]).trim();if(s==='')return {k:'kosong'};var v=parseNum(s,false);return isNaN(v)?{k:'salah'}:{k:'ok',v:v};});
    var angT=function(v){return teksIsian(Math.abs(v)).replace(',','{,}');},angP=function(v){return teksIsian(Math.abs(v));};
    var KOSONG_T='\\square',SALAH_T='{\\color{#b91c1c}?}';
    var tex='',teks='',ada=false;
    function suku(p,vr){
      if(p.k==='ok'&&p.v===0)return;
      var neg=p.k==='ok'&&p.v<0,satu=p.k==='ok'&&Math.abs(p.v)===1;
      var kT=p.k==='kosong'?KOSONG_T+' ':p.k==='salah'?SALAH_T:satu?'':angT(p.v);
      var kP=p.k==='kosong'?'□':p.k==='salah'?'?':satu?'':angP(p.v);
      if(!ada){tex+=(neg?'-':'')+kT+vr;teks+=(neg?'−':'')+kP+vr;}
      else{tex+=(neg?' - ':' + ')+kT+vr;teks+=(neg?' − ':' + ')+kP+vr;}
      ada=true;
    }
    suku(bag[0],'x');suku(bag[1],'y');
    if(!ada){tex='0';teks='0';}
    var c=bag[2];
    var cT=c.k==='kosong'?KOSONG_T:c.k==='salah'?SALAH_T:(c.v<0?'-':'')+angT(c.v);
    var cP=c.k==='kosong'?'□':c.k==='salah'?'?':(c.v<0?'−':'')+angP(c.v);
    return {tex:tex+' = '+cT,teks:teks+' = '+cP};
  }
  function pratinjau(i){
    if(!opsi.pratinjau)return;
    var St=curS(),it=St&&St.it&&St.it[i],box=pq('.pratinjau[data-pr="'+i+'"] .pr-isi');
    if(!box||!it||it.t!=='eq')return;
    var b=bentukPratinjau(S.ans[i]);
    box.textContent=b.teks;
    box.setAttribute('data-tex',b.tex);
    PL.Math.render(box);
  }
  function pratinjauSemua(){var St=curS();if(!opsi.pratinjau||!St||St.k!=='form')return;St.it.forEach(function(it,i){pratinjau(i);});}
  function panelLangkah(){
    var St=curS(),h='';
    h+='<h2>Langkah '+(S.s+1)+' · '+esc(St.nm)+'</h2><p>'+St.q+'</p>';
    if(St.k==='form'){
      if(St.lay==='koor')h+=koorHTML(St);
      else h+=St.it.map(function(it,i){return itemHTML(it,i,St);}).join('');
      if(St.it.some(function(it){return it.t==='eq';}))h+='<p class="muted">Tulis koefisien negatif dengan tanda minus, misalnya −3. Bentuk yang dikalikan atau disederhanakan juga diterima.</p>';
      else if(St.it.some(function(it){return it.t==='num';}))h+='<p class="muted">Bilangan negatif ditulis dengan tanda minus, misalnya −4. Pecahan boleh ditulis 1/3 atau 0,5.</p>';
    }else if(St.k==='pt')h+='<p class="state ptstate">Titik pilihanmu '+(S.pt?'<b>'+ptS(S.pt)+'</b>':'<span class="muted">belum ada</span>')+'</p><p class="muted">Ketuk satu titik kisi pada bidang koordinat.</p>';
    else h+='<p class="state selstate">'+selText()+'</p><p class="muted">Ketuk titik kisi pada bidang untuk memilih. Ketuk lagi titik yang sama untuk membatalkan.</p>';
    h+='<ul class="hints" hidden></ul><div class="fb" hidden></div><div class="actions row">'+(opsi.petunjuk?'<button class="btn ghost" data-aksi="petunjuk">💡 Petunjuk</button>':'')+'<button class="btn primary" data-aksi="periksa">Periksa</button></div>';
    el.panel.innerHTML=h;
    renderHints();
    pratinjauSemua();
  }

  /* ---- satu pendengar untuk seluruh panel ---- */
  el.panel.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled||!el.panel.contains(b))return;
    if(b.dataset.j!==undefined&&b.dataset.i!==undefined){
      var i=+b.dataset.i;if(S.lock[i]||S.solved)return;S.ans[i]=+b.dataset.j;
      var row=b.closest('.trow');row.classList.remove('bad');
      row.querySelectorAll('[data-j]').forEach(function(x){var o=+x.dataset.j===S.ans[i];x.classList.toggle('on',o);x.classList.toggle('sel',o);});
      return;
    }
    var a=b.dataset.aksi;if(!a)return;
    if(a==='periksa')periksa();
    else if(a==='petunjuk')tambahPetunjuk(true);
    else if(a==='dimana')diMana();
    else if(opsi.aksi)opsi.aksi(a,b);
  });
  el.panel.addEventListener('input',function(e){
    var inp=e.target;
    if(!inp.classList.contains('num')||inp.dataset.i===undefined)return;
    var i=+inp.dataset.i;
    if(inp.dataset.j!==undefined){S.ans[i][+inp.dataset.j]=inp.value;pratinjau(i);}else S.ans[i]=inp.value;
    var r=inp.closest('.trow');if(r)r.classList.remove('bad');inp.classList.remove('bad');
  });
  el.panel.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('num'))periksa();});
  el.svg.addEventListener('click',function(e){
    if(!S.Q||S.tahap!=='kerja'||S.solved||S.selesai)return;
    if(opsi.bolehKlik&&!opsi.bolehKlik())return;
    var St=curS(),c=bidang.klik(e);
    if(St.k==='pt'){S.pt=bidang.tempel(c);var ps=pq('.ptstate');if(ps)ps.innerHTML='Titik pilihanmu <b>'+ptS(S.pt)+'</b>';var f=pq('.fb');if(f&&f.classList.contains('info'))f.hidden=true;renderBidang();}
    else if(St.k==='pts'){
      var p=bidang.tempel(c),ix=-1;
      S.sel.forEach(function(r,i){if(r.x===p.x&&r.y===p.y)ix=i;});
      if(ix>=0)S.sel.splice(ix,1);else if(S.sel.length<16)S.sel.push(p);
      var ss=pq('.selstate');if(ss)ss.innerHTML=selText();renderBidang();
    }
  });

  /* ---- umpan balik ---- */
  function fb(kind,html){var e=pq('.fb');if(!e)return;e.hidden=false;e.className='fb '+kind;e.innerHTML=html;}
  /* ---- petunjuk bertahap ----
     opsi.petunjukLanjut(Q,s,St) : petunjuk tambahan yang tampil setelah petunjuk CORE
     opsi.gerbangPetunjuk = n     : petunjuk ke-(n+1) dan seterusnya baru terbuka setelah
                                    siswa mencoba menjawab minimal sekali pada langkah itu */
  function daftarPetunjuk(){
    var St=curS();if(!St)return [];
    var x=[];
    if(opsi.petunjukLanjut){try{x=opsi.petunjukLanjut(S.Q,S.s,St)||[];}catch(err){if(window.console)console.warn('petunjukLanjut',err);x=[];}}
    return St.h.concat(x);
  }
  function gerbangTertutup(){var g=opsi.gerbangPetunjuk;return g!=null&&S.hints>=g&&S.tries<1;}
  function tambahPetunjuk(sapa){var l=daftarPetunjuk();if(!l.length||S.hints>=l.length||gerbangTertutup())return;S.hints++;renderHints();if(sapa)PL.Plus.say('petunjuk');}
  function bukaSemuaPetunjuk(){if(!opsi.petunjuk)return;S.hints=daftarPetunjuk().length;renderHints();}
  function renderHints(){
    var box=pq('.hints');if(!box)return;
    var St=curS(),l=daftarPetunjuk(),n0=St?St.h.length:0;
    box.innerHTML=l.slice(0,S.hints).map(function(h,i){
      var isi=opsi.ubahPetunjuk?opsi.ubahPetunjuk(h):h,kls=i>=n0?' rinci':'';
      return '<li class="baru'+kls+'">'+isi+'</li>';
    }).join('');
    box.hidden=!S.hints||!opsi.petunjuk;
    var tb=pq('[data-aksi="petunjuk"]');
    if(tb){
      var habis=S.hints>=l.length,tutup=!habis&&gerbangTertutup();
      tb.hidden=!l.length;tb.disabled=habis||tutup;
      tb.textContent=habis?'💡 Semua petunjuk sudah dibuka'
        :tutup?'💡 Coba jawab dulu untuk membuka petunjuk berikutnya'
        :!S.hints?'💡 Petunjuk':'💡 Petunjuk lebih rinci ('+(S.hints+1)+' dari '+l.length+')';
    }
  }
  function tandai(r){
    var St=curS();if(St.k!=='form')return;
    r.items.forEach(function(ok,i){
      if(ok)S.lock[i]=true;
      var inps=el.panel.querySelectorAll('[data-i="'+i+'"]');
      inps.forEach(function(x){
        if(x.tagName==='INPUT'){x.classList.toggle('ok',ok);x.classList.toggle('bad',!ok);if(ok)x.disabled=true;}
        else if(x.classList.contains('trow')&&St.lay!=='koor'){x.classList.toggle('ok',ok);x.classList.toggle('bad',!ok);if(ok)x.querySelectorAll('button,input').forEach(function(y){y.disabled=true;});}
      });
    });
    if(St.lay==='koor')el.panel.querySelectorAll('.trow.koor').forEach(function(row){
      var i=+row.dataset.k,ok=r.items[i]&&r.items[i+1];row.classList.toggle('ok',ok);row.classList.toggle('bad',!ok);
    });
  }
  function kunciSemua(){el.panel.querySelectorAll('.trow button, .trow input').forEach(function(x){x.disabled=true;});var b=pq('[data-aksi="periksa"]');if(b)b.disabled=true;}
  function isiKunci(){
    var St=curS(),k=CORE.keyAns(S.Q,S.s);
    if(St.k==='pt')S.pt=k;
    else if(St.k==='pts')S.sel=k;
    else St.it.forEach(function(it,i){S.ans[i]=it.t==='pg'?k[i]:it.t==='num'?(it.u==='rp'?nm(k[i]):teksIsian(k[i])):k[i].map(teksIsian);S.lock[i]=true;});
  }
  function teksKunci(){
    var St=curS(),k=CORE.keyAns(S.Q,S.s);
    if(St.k==='pt')return ptS(k);
    if(St.k==='pts')return k.map(ptS).join(', ');
    if(St.lay==='koor'){var o=[];for(var i=0;i+1<St.it.length;i+=2)o.push(esc(St.it[i].lab)+' = '+ptS({x:k[i],y:k[i+1]}));return o.join(' ; ');}
    return St.it.map(function(it,i){var a=k[i];
      if(it.t==='pg')return esc(it.o[a]);
      if(it.t==='num')return esc(it.lab)+' '+(it.u==='rp'?U.rp(a):nm(a))+(it.u&&it.u!=='rp'?' '+esc(it.u):'');
      return U.eqS(Lq(a[0],a[1],a[2],'='));}).join(' ; ');
  }
  function tombol(html){var a=pq('.actions');if(a){a.innerHTML=html;var b=a.querySelector('.btn.primary');if(b&&b.focus)b.focus({preventScroll:true});}}
  function tambahTombol(html){var a=pq('.actions');if(a)a.insertAdjacentHTML('beforeend',html);}
  function periksa(){
    if(S.solved)return;
    var a=collect(),St=curS();
    if(a===null||!CORE.valid(S.Q,S.s,a)){fb('info',St.k==='pt'?'Ketuk satu titik pada bidang dulu.':St.k==='pts'?'Pilih titik pada bidang dulu.':'Lengkapi semua isian dulu. Pastikan isinya bilangan, misalnya −3, 2,5, atau 1/3.');return;}
    opsi.periksa(a,CORE.judge(S.Q,S.s,a));
  }

  /* ---- "Di mana salahku?" ----
     Menunjukkan bagian yang salah dan jenis kesalahannya tanpa memberi jawaban. */
  function tombolDiMana(){
    if(!opsi.diManaSalah||!S.lw)return;
    var e=pq('.fb');if(!e||e.hidden)return;
    e.insertAdjacentHTML('beforeend','<div class="whereBox"><button class="btn ghost" data-aksi="dimana" type="button">📍 Di mana salahku?</button> <span class="whereTxt" role="status"></span></div>');
  }
  /* membandingkan pasangan (x, y) jawaban dengan kunci: jenis kesalahan yang umum */
  function polaKoor(p,k){
    if(p.x===k.x&&p.y===k.y)return '';
    if(p.x===k.y&&p.y===k.x)return 'Nilai x dan y tertukar posisinya.';
    if(p.x===-k.x&&p.y===-k.y)return 'Tanda kedua koordinat terbalik.';
    if(p.x===k.x)return 'Nilai x sudah tepat. Periksa nilai y'+(p.y===-k.y?', tandanya terbalik.':'.');
    if(p.y===k.y)return 'Nilai y sudah tepat. Periksa nilai x'+(p.x===-k.x?', tandanya terbalik.':'.');
    if(Math.abs(p.x)===Math.abs(k.y)&&Math.abs(p.y)===Math.abs(k.x))return 'Posisi x dan y sudah ditukar dengan benar. Periksa tandanya.';
    return 'Kedua koordinat belum tepat. Tulis aturannya dulu, lalu substitusikan satu per satu.';
  }
  function diMana(){
    var w=S.lw;if(!w)return;
    var St=curS(),t=null,msg='';
    if(St.k==='form'){
      var i=w.r.items.indexOf(false),it=St.it[i],a=w.a[i];
      t={el:el.panel.querySelector('[data-i="'+(St.lay==='koor'?i-(i%2):i)+'"]')};
      if(St.lay==='koor'){
        var j=i-(i%2),pa={x:w.a[j],y:w.a[j+1]},pk={x:St.it[j].key,y:St.it[j+1].key};
        msg=esc(St.it[j].lab)+': '+polaKoor(pa,pk);
      }else if(it.t==='eq'){
        var k=it.key,sb=Math.abs(a[0]*k.b-a[1]*k.a)<1e-9;
        msg=sb?'Koefisien x dan y sudah sebanding dengan jawaban, tetapi ruas kanan (c) belum tepat.':'Koefisien x dan y belum tepat. Periksa tanda setelah substitusi.';
      }else if(it.t==='num'){
        if(a===-it.key)msg='Nilainya sudah benar, tetapi tandanya terbalik.';
        else if(Math.abs(it.key)>0&&Math.abs(a*it.key-1)<1e-9)msg='Kamu membalik pembagiannya. Bagi bayangan dengan asal, bukan sebaliknya.';
        else msg='Nilai pada isian ini belum tepat. Hitung ulang pelan-pelan.';
      }
      else msg='Pilihan pada baris ini belum tepat. Baca lagi soalnya.';
    }else if(St.k==='pt'){
      var p=w.a,kk=St.cond.p[0];t={pt:[p.x,p.y]};
      msg='Titik '+ptS(p)+' bukan titik yang dimaksud. '+polaKoor(p,kk);
    }else{
      var n=St.key.length;
      if(w.r.lebih.length){var ex=w.r.lebih[0];t={pt:[ex.x,ex.y]};msg='Titik '+ptS(ex)+' bukan titik yang dimaksud. Ketuk titik itu lagi untuk membatalkan.';}
      else msg='Titik yang kamu pilih sudah benar, tetapi masih kurang. Seharusnya ada '+n+' titik.';
    }
    var wt=pq('.whereTxt');if(wt)wt.textContent=msg;
    if(t)PL.Plus.go(t,msg,9000);
  }

  /* ---- kartu soal, progres, bidang ---- */
  function renderKartu(){
    if(!S.Q)return;
    el.ask.innerHTML=S.Q.soal;
    el.meta.innerHTML=opsi.meta?opsi.meta():esc(S.Q.jd+' · '+S.Q.lv);
  }
  function renderProgres(intro){
    if(!S.Q)return;
    var items=[{l:'Soal',d:!intro,c:!!intro}];
    S.Q.st.forEach(function(St,i){var done=S.selesai||(!intro&&(i<S.s||(i===S.s&&S.solved)));items.push({l:St.nm,d:done,c:!intro&&!S.selesai&&i===S.s&&!S.solved});});
    el.prog.innerHTML=items.map(function(it,i){return '<li class="'+(it.d?'done':it.c?'cur':'')+'"><span>'+(it.d?'✓':i+1)+'</span><em>'+esc(it.l)+'</em></li>';}).join('');
    el.stepText.textContent=intro?'Baca soal, lalu mulai':S.selesai?'Selesai 🎉':'Langkah '+(S.s+1)+' dari '+S.Q.st.length+' · '+S.Q.st[S.s].nm;
  }
  function qView(spec,extra){
    var V={};spec=spec||{};
    for(var k in spec)V[k]=spec[k];
    V.B=S.Q.pl;
    if(extra)for(var k2 in extra)V[k2]=extra[k2];
    return V;
  }
  function renderBidang(mode){
    if(!S.Q)return kosong();
    if(mode==='akhir'||S.selesai)return bidang.gambar(qView(S.Q.vz));
    if(mode==='awal')return bidang.gambar(qView(S.Q.st[0].v));
    var St=curS(),ex={};
    /* setelah langkah selesai, tampilkan jawaban pada bidang */
    if(St.k==='pt'){ex.pick=S.pt;ex.click=!S.solved;}
    if(St.k==='pts'){ex.sel=S.sel;ex.click=!S.solved;}
    bidang.gambar(qView(St.v,ex));
  }
  function kosong(cap){bidang.gambar({B:CORE.FULL,cap:cap||'Bidang koordinat akan menampilkan soal.'});}

  return {S:S,el:el,bidang:bidang,curS:curS,muat:muat,reset:reset,collect:collect,parseNum:parseNum,
    panelLangkah:panelLangkah,renderKartu:renderKartu,renderProgres:renderProgres,renderBidang:renderBidang,kosong:kosong,
    fb:fb,tandai:tandai,kunciSemua:kunciSemua,isiKunci:isiKunci,teksKunci:teksKunci,tombol:tombol,tambahTombol:tambahTombol,
    tambahPetunjuk:tambahPetunjuk,renderHints:renderHints,bukaSemuaPetunjuk:bukaSemuaPetunjuk,tombolDiMana:tombolDiMana,periksa:periksa,
    panduan:function(){var St=curS();if(!St)return null;return St.k==='pt'?'Hitung koordinatnya dulu, ya':St.k==='pts'?'Periksa lagi titik-titik pilihanmu, ya':'Periksa isian yang berwarna merah, ya';}};
};
})(window.PL=window.PL||{});

</script>
<script>
/* ==========================================================================
   latihan.js · TAB LATIHAN MANDIRI
   Wadah: <section id="tab-latihan">. Soal dibangkitkan acak oleh CORE,
   dinilai langsung di halaman, tidak dikirim ke server.
   Opsi khusus tab ini: petunjuk bertahap, "Di mana salahku?", percobaan tanpa batas,
   tombol "Lihat jawaban" setelah dua kali salah.
   Pemilih soal: bagian materi (A–E), level (LOTS/MOTS/HOTS), lalu tipe (1–24) atau acak.
   ========================================================================== */
(function(PL){
'use strict';
var U=PL.U,$=U.$,esc=U.esc;
var sec,L,pick={b:'C',l:'C',t:'C'},tahap='intro';

/* ---------- Petunjuk ----------
   Teks petunjuk lanjutan khusus Latihan ada di js/petunjuk.js (PL.Petunjuk), bila dimuat.
   Petunjuk ke-3 dan seterusnya baru terbuka setelah siswa mencoba menjawab minimal
   sekali pada langkah itu (GERBANG_PETUNJUK). */
var GERBANG_PETUNJUK=2;
function petunjukLanjut(Q,s,St){return PL.Petunjuk?PL.Petunjuk.lanjut(Q,s,St):[];}
function namaRumus(h){return PL.Petunjuk&&PL.Petunjuk.namaRumus?PL.Petunjuk.namaRumus(h):h;}

/* ---------- pemilih soal ---------- */
var BAGIAN_PILIH=[['ROT','A · Rotasi'],['DIL','B · Dilatasi'],['GRS','C · Persamaan garis'],['BONE','D · Konteks Bone'],['KOMP','E · Komposisi'],['C','Campuran']];
var LEVEL_PILIH=[['L','LOTS'],['M','MOTS'],['H','HOTS'],['C','Campuran']];
function semuaTipe(){var o=[];for(var t=1;t<=24;t++)o.push(t);return o;}
function cocok(t){return (pick.b==='C'||CORE.BG_TIPE[t]===pick.b)&&(pick.l==='C'||CORE.levels(t).indexOf(pick.l)>=0);}
function calonTipe(){return semuaTipe().filter(cocok);}
function acakDari(a){return a[Math.floor(Math.random()*a.length)];}
function soalBaru(){
  var calon=pick.t==='C'?calonTipe():[pick.t];
  if(!calon.length){pick.l='C';calon=calonTipe();}
  var t=acakDari(calon),lv=CORE.levels(t).filter(function(l){return pick.l==='C'||l===pick.l;});
  var l=acakDari(lv.length?lv:CORE.levels(t));
  L.muat(CORE.gen(t,l,Math.random,true),0);L.S.selesai=false;tahap='intro';render();
}
function render(){
  L.S.tahap=tahap==='kerja'?'kerja':'lain';
  sec.dataset.tahap=tahap;
  L.renderKartu();
  if(tahap==='intro'){L.renderProgres(true);panelIntro();L.renderBidang('awal');}
  else if(tahap==='selesai'){L.S.selesai=true;L.renderProgres();panelSelesai();L.renderBidang('akhir');}
  else{L.renderProgres();L.panelLangkah();L.renderBidang();}
  if(PL.kuis)PL.kuis.pendNotice(L.el.panel);
}
function chips(aksi,daftar,nilai,mati){
  return '<div class="chips">'+daftar.map(function(o){var m=mati&&mati(o[0]);return '<button class="chip'+(String(nilai)===o[0]?' on':'')+'" data-aksi="'+aksi+'" data-v="'+o[0]+'"'+(m?' disabled title="Tidak ada soal untuk pilihan ini"':'')+'>'+esc(o[1])+'</button>';}).join('')+'</div>';
}
function panelIntro(){
  var Q=L.S.Q,h='<h2>Pilih soal</h2><p class="muted">Pilih bagian dan level, lalu tipe soal. Setiap tekan 🎲 menghasilkan soal baru.</p>';
  h+='<div class="lvl"><b>Bagian</b>'+chips('bagian',BAGIAN_PILIH,pick.b)+'</div>';
  h+='<div class="lvl"><b>Level</b>'+chips('level',LEVEL_PILIH,pick.l,function(v){
    if(v==='C')return false;return !semuaTipe().some(function(t){return (pick.b==='C'||CORE.BG_TIPE[t]===pick.b)&&CORE.levels(t).indexOf(v)>=0;});})+'</div>';
  var daftar=calonTipe();
  h+='<div class="lvl"><label for="pilihTipe"><b>Tipe soal</b></label><select id="pilihTipe" class="pilih-tipe" data-aksi="tipe"><option value="C"'+(pick.t==='C'?' selected':'')+'>Acak dari '+daftar.length+' tipe</option>'
    +daftar.map(function(t){return '<option value="'+t+'"'+(pick.t===t?' selected':'')+'>Tipe '+t+' · '+esc(CORE.TIPE[t])+' ('+CORE.levels(t).map(function(l){return CORE.LEVEL[l];}).join('/')+')</option>';}).join('')+'</select></div>';
  h+='<div class="row"><button class="btn" data-aksi="acak">🎲 Soal acak</button></div>';
  h+='<div class="note"><p>Soal di atas termasuk <b>'+esc(Q.jd+' · '+Q.lv)+'</b> dengan kata kerja <i>'+esc(Q.kko)+'</i>.</p><p>Di Latihan kamu boleh mencoba berulang kali, membuka 💡 Petunjuk, dan memakai 📍 Di mana salahku?</p></div>';
  h+='<div class="row"><button class="btn primary" data-aksi="mulai">Mulai ➜</button></div>';
  L.el.panel.innerHTML=h;
}
function panelSelesai(){
  L.el.panel.innerHTML='<h2>🎉 Soal selesai</h2><h3>Pembahasan</h3><ol class="sum">'+L.S.Q.bahas.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ol>'
    +'<div class="row"><button class="btn primary" data-aksi="acak">Soal berikutnya ➜</button><button class="btn" data-aksi="ulangi">↺ Ulangi soal ini</button><button class="btn ghost" data-aksi="ke-kuis">Kuis ➜</button></div>';
  if(PL.Math)PL.Math.render(L.el.panel);
}
/* ---------- Penyelesaian bertahap ----------
   Setelah jawaban benar atau 🔑 Lihat jawaban, langkah yang memerlukan perhitungan ditampilkan
   lengkap. Isinya dari js/penyelesaian.js (PL.Penyelesaian), bila dimuat. */
function tampilPenyelesaian(){
  var pn=L.el.panel,lama=pn.querySelector('.penyelesaian');if(lama)lama.remove();
  if(!PL.Penyelesaian)return;
  var bl;try{bl=PL.Penyelesaian.langkah(L.S.Q,L.S.s);}catch(err){if(window.console)console.warn('penyelesaian',err);return;}
  if(!bl||!bl.length)return;
  var fb=pn.querySelector('.fb');if(!fb)return;
  fb.insertAdjacentHTML('afterend',PL.Penyelesaian.html(bl));
  var box=pn.querySelector('.penyelesaian');if(box&&PL.Math)PL.Math.render(box);
}
function periksa(a,r){
  var S=L.S,akhir=S.s>=S.Q.st.length-1;
  if(r.ok){
    S.solved=true;L.tandai(r);L.kunciSemua();
    var hh=L.el.panel.querySelector('.hints');if(hh)hh.hidden=true;
    L.fb('ok','Tepat! '+(akhir?'Soal ini selesai.':'Lanjut ke langkah berikutnya.'));
    tampilPenyelesaian();
    PL.Plus.say(akhir?'selesai':'benar');
    L.tombol('<button class="btn primary" data-aksi="lanjut">'+(akhir?'Lihat pembahasan ➜':'Langkah berikutnya ➜')+'</button>');
    L.renderBidang();L.renderProgres();
  }else{
    S.tries++;L.tandai(r);S.lw={a:a,r:r};
    var St=L.curS(),sebagian=St.k==='form'&&r.items.some(Boolean)&&r.items.length>1;
    L.fb('bad','Belum tepat. '+(sebagian?'Isian yang hijau sudah benar. ':'')+(St.k==='pts'&&r.lebih&&!r.lebih.length?'Titik pilihanmu benar, tetapi masih kurang. ':'')+'Baca petunjuk, lalu coba lagi.');
    if(S.hints<2)L.tambahPetunjuk(false);else L.renderHints();
    L.tombolDiMana();
    if(S.tries>=2&&!L.el.panel.querySelector('[data-aksi="kunci"]'))L.tambahTombol('<button class="btn ghost" data-aksi="kunci">🔑 Lihat jawaban</button>');
    PL.Plus.say('salah');
  }
}
function lihatKunci(){
  var S=L.S,akhir=S.s>=S.Q.st.length-1;L.isiKunci();S.solved=true;L.panelLangkah();L.kunciSemua();
  L.bukaSemuaPetunjuk();
  L.fb('info','🔑 Jawaban yang benar: <b>'+L.teksKunci()+'</b>. Pelajari, lalu lanjutkan.');
  tampilPenyelesaian();
  L.tombol('<button class="btn primary" data-aksi="lanjut">'+(akhir?'Lihat pembahasan ➜':'Langkah berikutnya ➜')+'</button>');L.renderBidang();
}
function lanjut(){var S=L.S;if(S.s<S.Q.st.length-1){S.s++;L.reset();render();}else{tahap='selesai';render();PL.Plus.say('selesai');}}
function aksi(a,b){
  if(a==='bagian'){pick.b=b.dataset.v;pick.t='C';if(!calonTipe().length)pick.l='C';soalBaru();}
  else if(a==='level'){pick.l=b.dataset.v;pick.t='C';soalBaru();}
  else if(a==='acak')soalBaru();
  else if(a==='mulai'){tahap='kerja';L.S.s=0;L.reset();render();PL.Plus.say('sapa');}
  else if(a==='lanjut')lanjut();
  else if(a==='kunci')lihatKunci();
  else if(a==='ulangi'){tahap='kerja';L.S.selesai=false;L.S.s=0;L.reset();render();}
  else if(a==='ke-kuis')PL.pindahTab('kuis');
}
PL.TAB=PL.TAB||{};
PL.TAB.latihan={
  init:function(){
    sec=$('#tab-latihan');
    L=PL.Langkah(sec,{petunjuk:true,diManaSalah:true,pratinjau:true,ubahPetunjuk:namaRumus,petunjukLanjut:petunjukLanjut,gerbangPetunjuk:GERBANG_PETUNJUK,periksa:periksa,aksi:aksi,
      meta:function(){var Q=L.S.Q;return esc(Q.jd+' · '+Q.lv);}});
    this.bidang=L.bidang;this.panduan=L.panduan;this.L=L;
    /* pemilih tipe (select) */
    L.el.panel.addEventListener('change',function(e){if(e.target.id==='pilihTipe'){var v=e.target.value;pick.t=v==='C'?'C':+v;soalBaru();}});
    /* tombol di kartu soal (di luar panel) */
    sec.querySelector('.kartu').addEventListener('click',function(e){
      var b=e.target.closest('[data-aksi]');if(!b)return;
      if(b.dataset.aksi==='ulangi'&&tahap!=='intro')aksi('ulangi');
      else if(b.dataset.aksi==='acak')soalBaru();
    });
    soalBaru();
  },
  tampil:function(){render();},
  sembunyi:function(){return true;}
};
})(window.PL);

</script>
<script>
/* ==========================================================================
   main.js · PENGATUR TAB
   Dipakai oleh DUA halaman:
     index.html  → tab Belajar + Latihan Mandiri
     kuis.html   → tab Kuis saja
   Setiap tab terdaftar di PL.TAB dengan siklus hidup yang sama:
     init()      sekali saat halaman dimuat
     tampil()    setiap kali tab dibuka
     sembunyi()  sebelum tab ditinggalkan; kembalikan false untuk membatalkan
     jaga()      (opsional) true = peringatkan sebelum halaman ditutup
   Mode aktif ditulis di <body data-mode="belajar|latihan|kuis"> sehingga
   perbedaan tampilan antarmode cukup diatur di CSS (lapisan "mode").
   Bila tombol meminta tab yang tidak ada di halaman ini, peramban
   diarahkan ke halaman yang memuatnya (lihat HALAMAN).
   ========================================================================== */
(function(PL){
'use strict';
var HALAMAN={belajar:'index.html',latihan:'index.html#latihan',kuis:'kuis.html'};
var aktif=null,pergi=false;
PL.TAB=PL.TAB||{};
PL.pindahTab=function(nama){
  if(nama===aktif)return;
  var lama=PL.TAB[aktif];
  if(lama&&lama.sembunyi()===false)return;
  if(!PL.TAB[nama]){                       /* tab ada di halaman lain */
    if(HALAMAN[nama]){pergi=true;location.href=HALAMAN[nama];}
    return;
  }
  PL.U.$$('.tab-view').forEach(function(v){v.hidden=v.dataset.tab!==nama;});
  PL.U.$$('[role="tab"]').forEach(function(t){var on=t.dataset.tab===nama;t.classList.toggle('on',on);t.setAttribute('aria-selected',on?'true':'false');});
  document.body.dataset.mode=nama;
  aktif=nama;
  try{history.replaceState(null,'',nama===awal?location.pathname+location.search:'#'+nama);}catch(_){}
  PL.Plus.home();
  PL.Plus.bidang=PL.TAB[nama].bidang||null;
  PL.Plus.panduan=PL.TAB[nama].panduan||null;
  PL.TAB[nama].tampil();
  if(PL.barSync)PL.barSync();
};
PL.U.$$('[role="tab"]').forEach(function(t){t.addEventListener('click',function(){PL.pindahTab(t.dataset.tab);});});
window.addEventListener('beforeunload',function(e){
  if(pergi){pergi=false;return;}           /* sudah dikonfirmasi lewat sembunyi() */
  var j=Object.keys(PL.TAB).some(function(k){return PL.TAB[k].jaga&&PL.TAB[k].jaga();});
  if(j){e.preventDefault();e.returnValue='';}
});
Object.keys(PL.TAB).forEach(function(k){PL.TAB[k].init();});
window.__api={CORE:CORE,PL:PL};   /* untuk pemeriksaan di konsol: __api.CORE.cek() */
/* tab pertama yang terdaftar di halaman ini; index.html#latihan membuka Latihan Mandiri */
var awal=Object.keys(PL.TAB)[0],minta=(location.hash||'').slice(1);
PL.pindahTab(PL.TAB[minta]?minta:awal);
})(window.PL);

</script>
</body>
